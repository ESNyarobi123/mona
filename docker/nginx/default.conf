upstream monana_web {
    server web:3000;
}

# The bot HTTP bridge is internal-only (web → bot:4000).
# It is deliberately NOT proxied here.

# Brute-force protection for credential endpoints ONLY.
# Session endpoints (/api/auth, /api/auth/locale) are called on nearly every
# page view — throttling those signs users out with a 429, so they are excluded.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_status 429;

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name monanafood.co.tz www.monanafood.co.tz _;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name monanafood.co.tz www.monanafood.co.tz _;
    client_max_body_size 20M;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Password / OTP submission — throttled.
    # NOTE: never add a plain prefix location that ends in a slash here
    # (e.g. "location /api/auth/") — nginx then 301s /api/auth to /api/auth/,
    # Next.js redirects back, and the endless loop makes every session check
    # fail with "Failed to fetch".
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://monana_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://monana_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
